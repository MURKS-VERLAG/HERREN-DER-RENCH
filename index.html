<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Die Herren der Rench</title>
  <style>
    :root {
      --reveal-time: 3600ms;
      --return-time: 2800ms;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    /*
      Die Bühne benutzt das Seitenverhältnis von Bild 1.
      Das vollständige Motiv bleibt immer sichtbar; freie Fläche bleibt schwarz.
    */
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 2690 / 1896));
      height: min(100vh, calc(100vw * 1896 / 2690));
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #bild2,
    #bild1Source,
    #bild1Canvas,
    #fog {
      position: absolute;
      inset: -18%;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.66;
    }

    .fog-layer {
      position: absolute;
      inset: 0;
      filter: blur(30px);
      will-change: transform;
    }

    .fog-layer::before,
    .fog-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background-repeat: repeat-x;
      background-size: 52% 100%;
    }

    .fog-layer.one {
      opacity: 0.30;
      animation: fogMoveLeft 38s linear infinite;
    }

    .fog-layer.one::before {
      background-image:
        radial-gradient(ellipse at 12% 65%, rgba(255,255,255,.34) 0 8%, rgba(255,255,255,.12) 19%, transparent 40%),
        radial-gradient(ellipse at 52% 58%, rgba(255,255,255,.27) 0 8%, rgba(255,255,255,.09) 20%, transparent 42%),
        radial-gradient(ellipse at 90% 70%, rgba(255,255,255,.31) 0 7%, rgba(255,255,255,.10) 19%, transparent 40%);
    }

    .fog-layer.two {
      opacity: 0.22;
      animation: fogMoveRight 57s linear infinite;
    }

    .fog-layer.two::after {
      background-image:
        radial-gradient(ellipse at 7% 43%, rgba(255,255,255,.24) 0 7%, rgba(255,255,255,.08) 19%, transparent 42%),
        radial-gradient(ellipse at 48% 68%, rgba(255,255,255,.31) 0 8%, rgba(255,255,255,.10) 22%, transparent 44%),
        radial-gradient(ellipse at 86% 49%, rgba(255,255,255,.22) 0 8%, rgba(255,255,255,.07) 18%, transparent 40%);
    }

    @keyframes fogMoveLeft {
      from { transform: translate3d(-17%, 0, 0) scale(1.08); }
      to   { transform: translate3d(17%, 0, 0) scale(1.08); }
    }

    @keyframes fogMoveRight {
      from { transform: translate3d(17%, 0, 0) scale(1.14); }
      to   { transform: translate3d(-17%, 0, 0) scale(1.14); }
    }

    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Bild 2 liegt permanent unverändert unter Bild 1. */
    #bild2 {
      z-index: 1;
      object-fit: fill;
      pointer-events: none;
    }

    /* Nur als unveränderte Bildquelle für das Canvas; selbst unsichtbar. */
    #bild1Source {
      z-index: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* Sichtbares Bild 1. Es wird ausschließlich über das Canvas abgetragen. */
    #bild1Canvas {
      z-index: 2;
      pointer-events: none;
    }

    /* Dezente Brösel und Staubpartikel. */
    #particleCanvas {
      z-index: 4;
      pointer-events: none;
    }

    /* Unsichtbarer Hoverbereich exakt über dem Burgtor unter der roten Schrift. */
    #gateHotspot {
      position: absolute;
      z-index: 5;
      left: 40.3%;
      top: 59.2%;
      width: 19.2%;
      height: 39.8%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Hauptmenü Die Herren der Rench">
    <img id="bild2" src="bild-2.jpg" alt="">
    <img id="bild1Source" src="bild-1.jpg" alt="">
    <canvas id="bild1Canvas" aria-hidden="true"></canvas>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div id="fog" aria-hidden="true">
      <div class="fog-layer one"></div>
      <div class="fog-layer two"></div>
    </div>
    <button id="gateHotspot" type="button" aria-label="Burgtor"></button>
  </main>

  <script>
    "use strict";

    const REVEAL_DURATION = 3600;
    const RETURN_DURATION = 2800;
    const EDGE_COLUMNS = 84;
    const EDGE_DEPTH = 0.030;
    const PARTICLE_LIMIT = 260;

    const stage = document.getElementById("stage");
    const imageOne = document.getElementById("bild1Source");
    const imageCanvas = document.getElementById("bild1Canvas");
    const particleCanvas = document.getElementById("particleCanvas");
    const gateHotspot = document.getElementById("gateHotspot");

    const imageContext = imageCanvas.getContext("2d");
    const particleContext = particleCanvas.getContext("2d");

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let progress = 0;
    let targetProgress = 0;
    let previousTime = performance.now();
    let frameRequest = null;
    let particles = [];

    /* Feste Zufallswerte sorgen für eine organische, aber stabile Bruchkante. */
    const edgeNoise = Array.from({ length: EDGE_COLUMNS + 1 }, (_, index) => {
      const waveA = Math.sin(index * 1.91) * 0.52;
      const waveB = Math.sin(index * 4.27 + 0.8) * 0.28;
      const random = (Math.random() - 0.5) * 0.45;
      return waveA + waveB + random;
    });

    function resizeCanvases() {
      const rectangle = stage.getBoundingClientRect();
      width = Math.max(1, Math.round(rectangle.width));
      height = Math.max(1, Math.round(rectangle.height));
      pixelRatio = Math.max(1, window.devicePixelRatio || 1);

      for (const canvas of [imageCanvas, particleCanvas]) {
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      }

      imageContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      particleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawImageOne();
      drawParticles();
    }

    function jaggedEdgeY(columnIndex) {
      const base = progress * height;
      const strength = Math.sin(progress * Math.PI) * height * EDGE_DEPTH;
      const timeWave = Math.sin(columnIndex * 0.72 + progress * 14) * strength * 0.22;
      return Math.max(0, Math.min(height, base + edgeNoise[columnIndex] * strength + timeWave));
    }

    function drawImageOne() {
      imageContext.clearRect(0, 0, width, height);

      if (!imageOne.complete || imageOne.naturalWidth === 0 || progress >= 1) {
        return;
      }

      imageContext.drawImage(imageOne, 0, 0, width, height);

      if (progress <= 0) {
        return;
      }

      /* Alles oberhalb der unregelmäßigen Bruchkante wird transparent. */
      imageContext.save();
      imageContext.globalCompositeOperation = "destination-out";
      imageContext.beginPath();
      imageContext.moveTo(0, 0);
      imageContext.lineTo(width, 0);

      for (let column = EDGE_COLUMNS; column >= 0; column -= 1) {
        const x = (column / EDGE_COLUMNS) * width;
        imageContext.lineTo(x, jaggedEdgeY(column));
      }

      imageContext.closePath();
      imageContext.fill();

      /* Kleine ausgefressene Stellen direkt an der Kante. */
      const craterCount = Math.round(22 + 58 * Math.sin(progress * Math.PI));
      for (let index = 0; index < craterCount; index += 1) {
        const x = ((index * 47.3) % 100) / 100 * width;
        const column = Math.round((x / width) * EDGE_COLUMNS);
        const y = jaggedEdgeY(column) + Math.sin(index * 9.7) * height * 0.013;
        const radius = 1.2 + ((index * 13) % 11) * 0.42;
        imageContext.beginPath();
        imageContext.arc(x, y, radius, 0, Math.PI * 2);
        imageContext.fill();
      }
      imageContext.restore();
    }

    function spawnParticles(direction) {
      if (progress <= 0.01 || progress >= 0.99) return;

      const count = direction > 0 ? 3 : 1;
      for (let index = 0; index < count; index += 1) {
        const x = Math.random() * width;
        const column = Math.round((x / width) * EDGE_COLUMNS);
        particles.push({
          x,
          y: jaggedEdgeY(column) + (Math.random() - 0.5) * 9,
          vx: (Math.random() - 0.5) * 0.55,
          vy: 0.35 + Math.random() * 1.15,
          gravity: 0.012 + Math.random() * 0.024,
          size: 0.8 + Math.random() * 3.0,
          alpha: 0.12 + Math.random() * 0.34,
          life: 34 + Math.random() * 72,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.10
        });
      }

      if (particles.length > PARTICLE_LIMIT) {
        particles.splice(0, particles.length - PARTICLE_LIMIT);
      }
    }

    function updateParticles() {
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += particle.gravity;
        particle.rotation += particle.spin;
        particle.life -= 1;
        particle.alpha *= 0.985;
      }

      particles = particles.filter(particle =>
        particle.life > 0 &&
        particle.alpha > 0.01 &&
        particle.y < height + 20
      );
    }

    function drawParticles() {
      particleContext.clearRect(0, 0, width, height);

      for (const particle of particles) {
        particleContext.save();
        particleContext.translate(particle.x, particle.y);
        particleContext.rotate(particle.rotation);
        particleContext.fillStyle = `rgba(175, 175, 175, ${particle.alpha})`;
        particleContext.fillRect(
          -particle.size / 2,
          -particle.size / 3,
          particle.size,
          particle.size * 0.65
        );
        particleContext.restore();
      }
    }

    function requestAnimation() {
      if (frameRequest === null) {
        previousTime = performance.now();
        frameRequest = requestAnimationFrame(animate);
      }
    }

    function animate(currentTime) {
      const elapsed = Math.min(50, currentTime - previousTime);
      previousTime = currentTime;

      const movingForward = targetProgress > progress;
      const duration = movingForward ? REVEAL_DURATION : RETURN_DURATION;
      const amount = elapsed / duration;

      if (Math.abs(targetProgress - progress) <= amount) {
        progress = targetProgress;
      } else {
        progress += movingForward ? amount : -amount;
      }

      progress = Math.max(0, Math.min(1, progress));

      drawImageOne();
      spawnParticles(movingForward ? 1 : -1);
      updateParticles();
      drawParticles();

      const transitionActive = Math.abs(targetProgress - progress) > 0.0001;
      if (transitionActive || particles.length > 0) {
        frameRequest = requestAnimationFrame(animate);
      } else {
        frameRequest = null;
      }
    }

    gateHotspot.addEventListener("pointerenter", () => {
      targetProgress = 1;
      requestAnimation();
    });

    gateHotspot.addEventListener("pointerleave", () => {
      targetProgress = 0;
      requestAnimation();
    });

    imageOne.addEventListener("load", resizeCanvases);
    window.addEventListener("resize", resizeCanvases);

    if (imageOne.complete) {
      resizeCanvases();
    }
  </script>
</body>
</html>
