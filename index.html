<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Die Herren der Rench</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 1345 / 948));
      height: min(100vh, calc(100vw * 948 / 1345));
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #bild2,
    #bild1Source,
    #bild1Canvas,
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #bild2 {
      z-index: 1;
      object-fit: fill;
      pointer-events: none;
    }

    #bild1Source {
      z-index: 0;
      opacity: 0;
      pointer-events: none;
    }

    #bild1Canvas {
      z-index: 2;
      pointer-events: none;
    }

    /* Der Nebel liegt dauerhaft über beiden Bildern und läuft ohne Unterbrechung weiter. */
    #fog {
      position: absolute;
      inset: -18%;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.56;
    }

    .fog-layer {
      position: absolute;
      inset: 0;
      filter: blur(30px);
      transform: translateZ(0);
      will-change: transform;
    }

    .fog-layer::before,
    .fog-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background-repeat: repeat-x;
      background-size: 52% 100%;
    }

    .fog-layer.one {
      opacity: 0.42;
      animation: fogLeft 36s linear infinite;
    }

    .fog-layer.one::before {
      background-image:
        radial-gradient(ellipse at 8% 63%, rgba(255,255,255,.36) 0 8%, rgba(255,255,255,.12) 20%, transparent 41%),
        radial-gradient(ellipse at 47% 55%, rgba(255,255,255,.26) 0 8%, rgba(255,255,255,.09) 19%, transparent 40%),
        radial-gradient(ellipse at 87% 69%, rgba(255,255,255,.32) 0 9%, rgba(255,255,255,.10) 19%, transparent 42%);
    }

    .fog-layer.two {
      opacity: 0.28;
      animation: fogRight 52s linear infinite;
    }

    .fog-layer.two::after {
      background-image:
        radial-gradient(ellipse at 13% 38%, rgba(255,255,255,.27) 0 8%, rgba(255,255,255,.08) 20%, transparent 43%),
        radial-gradient(ellipse at 56% 62%, rgba(255,255,255,.34) 0 9%, rgba(255,255,255,.10) 21%, transparent 45%),
        radial-gradient(ellipse at 93% 43%, rgba(255,255,255,.23) 0 8%, rgba(255,255,255,.07) 18%, transparent 41%);
    }

    @keyframes fogLeft {
      from { transform: translate3d(-17%, 0, 0) scale(1.10); }
      to   { transform: translate3d(17%, 0, 0) scale(1.10); }
    }

    @keyframes fogRight {
      from { transform: translate3d(17%, 0, 0) scale(1.16); }
      to   { transform: translate3d(-17%, 0, 0) scale(1.16); }
    }

    #particleCanvas {
      z-index: 4;
      pointer-events: none;
    }

    #gateHotspot {
      position: absolute;
      z-index: 6;
      left: 40.3%;
      top: 59.2%;
      width: 19.2%;
      height: 39.8%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Kleiner Hinweis, weil Browser Musik erst nach einem Klick erlauben. */
    #soundHint {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 2.2%;
      transform: translateX(-50%);
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.38);
      background: rgba(0,0,0,.62);
      color: rgba(255,255,255,.88);
      font: 600 12px/1.1 Georgia, serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .5s ease;
    }

    #soundHint.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Hauptmenü Die Herren der Rench">
    <img id="bild2" src="bild-2.jpg" alt="">
    <img id="bild1Source" src="bild-1.jpg" alt="">
    <canvas id="bild1Canvas" aria-hidden="true"></canvas>

    <div id="fog" aria-hidden="true">
      <div class="fog-layer one"></div>
      <div class="fog-layer two"></div>
    </div>

    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <button id="gateHotspot" type="button" aria-label="Burgtor"></button>
    <button id="soundHint" type="button">Klick für Musik</button>

    <audio id="musicOne" src="musik-bild-1.mp3" preload="auto" loop></audio>
    <audio id="musicTwo" src="musik-bild-2.mp3" preload="auto" loop></audio>
  </main>

  <script>
    "use strict";

    const REVEAL_DURATION = 3600;
    const RETURN_DURATION = 2800;
    const EDGE_COLUMNS = 84;
    const EDGE_DEPTH = 0.030;
    const PARTICLE_LIMIT = 260;
    const MUSIC_MAX_VOLUME = 0.72;
    const MUSIC_FADE_SECONDS = 2.4;

    const stage = document.getElementById("stage");
    const imageOne = document.getElementById("bild1Source");
    const imageCanvas = document.getElementById("bild1Canvas");
    const particleCanvas = document.getElementById("particleCanvas");
    const gateHotspot = document.getElementById("gateHotspot");
    const soundHint = document.getElementById("soundHint");
    const musicOne = document.getElementById("musicOne");
    const musicTwo = document.getElementById("musicTwo");

    const imageContext = imageCanvas.getContext("2d");
    const particleContext = particleCanvas.getContext("2d");

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let progress = 0;
    let targetProgress = 0;
    let previousTime = performance.now();
    let frameRequest = null;
    let particles = [];
    let audioUnlocked = false;
    let gateActive = false;
    let audioFrame = null;
    let audioPreviousTime = performance.now();

    musicOne.volume = 0;
    musicTwo.volume = 0;

    const edgeNoise = Array.from({ length: EDGE_COLUMNS + 1 }, (_, index) => {
      const waveA = Math.sin(index * 1.91) * 0.52;
      const waveB = Math.sin(index * 4.27 + 0.8) * 0.28;
      const random = (Math.random() - 0.5) * 0.45;
      return waveA + waveB + random;
    });

    function resizeCanvases() {
      const rectangle = stage.getBoundingClientRect();
      width = Math.max(1, Math.round(rectangle.width));
      height = Math.max(1, Math.round(rectangle.height));
      pixelRatio = Math.max(1, window.devicePixelRatio || 1);

      for (const canvas of [imageCanvas, particleCanvas]) {
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      }

      imageContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      particleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawImageOne();
      drawParticles();
    }

    function jaggedEdgeY(columnIndex) {
      const base = progress * height;
      const strength = Math.sin(progress * Math.PI) * height * EDGE_DEPTH;
      const timeWave = Math.sin(columnIndex * 0.72 + progress * 14) * strength * 0.22;
      return Math.max(0, Math.min(height, base + edgeNoise[columnIndex] * strength + timeWave));
    }

    function drawImageOne() {
      imageContext.clearRect(0, 0, width, height);

      if (!imageOne.complete || imageOne.naturalWidth === 0 || progress >= 1) return;

      imageContext.drawImage(imageOne, 0, 0, width, height);
      if (progress <= 0) return;

      imageContext.save();
      imageContext.globalCompositeOperation = "destination-out";
      imageContext.beginPath();
      imageContext.moveTo(0, 0);
      imageContext.lineTo(width, 0);

      for (let column = EDGE_COLUMNS; column >= 0; column -= 1) {
        const x = (column / EDGE_COLUMNS) * width;
        imageContext.lineTo(x, jaggedEdgeY(column));
      }

      imageContext.closePath();
      imageContext.fill();

      const craterCount = Math.round(22 + 58 * Math.sin(progress * Math.PI));
      for (let index = 0; index < craterCount; index += 1) {
        const x = ((index * 47.3) % 100) / 100 * width;
        const column = Math.round((x / width) * EDGE_COLUMNS);
        const y = jaggedEdgeY(column) + Math.sin(index * 9.7) * height * 0.013;
        const radius = 1.2 + ((index * 13) % 11) * 0.42;
        imageContext.beginPath();
        imageContext.arc(x, y, radius, 0, Math.PI * 2);
        imageContext.fill();
      }
      imageContext.restore();
    }

    function spawnParticles(direction) {
      if (progress <= 0.01 || progress >= 0.99) return;

      const count = direction > 0 ? 3 : 1;
      for (let index = 0; index < count; index += 1) {
        const x = Math.random() * width;
        const column = Math.round((x / width) * EDGE_COLUMNS);
        particles.push({
          x,
          y: jaggedEdgeY(column) + (Math.random() - 0.5) * 9,
          vx: (Math.random() - 0.5) * 0.55,
          vy: 0.35 + Math.random() * 1.15,
          gravity: 0.012 + Math.random() * 0.024,
          size: 0.8 + Math.random() * 3.0,
          alpha: 0.12 + Math.random() * 0.34,
          life: 34 + Math.random() * 72,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.10
        });
      }

      if (particles.length > PARTICLE_LIMIT) {
        particles.splice(0, particles.length - PARTICLE_LIMIT);
      }
    }

    function updateParticles() {
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += particle.gravity;
        particle.rotation += particle.spin;
        particle.life -= 1;
        particle.alpha *= 0.985;
      }

      particles = particles.filter(particle =>
        particle.life > 0 && particle.alpha > 0.01 && particle.y < height + 20
      );
    }

    function drawParticles() {
      particleContext.clearRect(0, 0, width, height);

      for (const particle of particles) {
        particleContext.save();
        particleContext.translate(particle.x, particle.y);
        particleContext.rotate(particle.rotation);
        particleContext.fillStyle = `rgba(175, 175, 175, ${particle.alpha})`;
        particleContext.fillRect(
          -particle.size / 2,
          -particle.size / 3,
          particle.size,
          particle.size * 0.65
        );
        particleContext.restore();
      }
    }

    function requestAnimation() {
      if (frameRequest === null) {
        previousTime = performance.now();
        frameRequest = requestAnimationFrame(animate);
      }
    }

    function animate(currentTime) {
      const elapsed = Math.min(50, currentTime - previousTime);
      previousTime = currentTime;

      const movingForward = targetProgress > progress;
      const duration = movingForward ? REVEAL_DURATION : RETURN_DURATION;
      const amount = elapsed / duration;

      if (Math.abs(targetProgress - progress) <= amount) {
        progress = targetProgress;
      } else {
        progress += movingForward ? amount : -amount;
      }

      progress = Math.max(0, Math.min(1, progress));
      drawImageOne();
      spawnParticles(movingForward ? 1 : -1);
      updateParticles();
      drawParticles();

      const transitionActive = Math.abs(targetProgress - progress) > 0.0001;
      if (transitionActive || particles.length > 0) {
        frameRequest = requestAnimationFrame(animate);
      } else {
        frameRequest = null;
      }
    }

    async function unlockAudio() {
      if (audioUnlocked) return;

      try {
        const chosenTrack = gateActive ? musicTwo : musicOne;
        chosenTrack.volume = 0;
        await chosenTrack.play();
        audioUnlocked = true;
        soundHint.classList.add("hidden");
        startAudioFade();
      } catch (error) {
        soundHint.classList.remove("hidden");
      }
    }

    function startAudioFade() {
      if (!audioUnlocked || audioFrame !== null) return;
      audioPreviousTime = performance.now();
      audioFrame = requestAnimationFrame(updateAudioFade);
    }

    function updateAudioFade(now) {
      const elapsedSeconds = Math.min(0.05, (now - audioPreviousTime) / 1000);
      audioPreviousTime = now;
      const step = (MUSIC_MAX_VOLUME / MUSIC_FADE_SECONDS) * elapsedSeconds;
      const targetOne = gateActive ? 0 : MUSIC_MAX_VOLUME;
      const targetTwo = gateActive ? MUSIC_MAX_VOLUME : 0;

      if (targetOne > 0 && musicOne.paused) musicOne.play().catch(() => {});
      if (targetTwo > 0 && musicTwo.paused) musicTwo.play().catch(() => {});

      musicOne.volume = moveToward(musicOne.volume, targetOne, step);
      musicTwo.volume = moveToward(musicTwo.volume, targetTwo, step);

      if (musicOne.volume === 0 && targetOne === 0 && !musicOne.paused) musicOne.pause();
      if (musicTwo.volume === 0 && targetTwo === 0 && !musicTwo.paused) musicTwo.pause();

      const finished = musicOne.volume === targetOne && musicTwo.volume === targetTwo;
      if (finished) {
        audioFrame = null;
      } else {
        audioFrame = requestAnimationFrame(updateAudioFade);
      }
    }

    function moveToward(current, target, amount) {
      if (current < target) return Math.min(target, current + amount);
      if (current > target) return Math.max(target, current - amount);
      return target;
    }

    function setGateActive(active) {
      gateActive = active;
      targetProgress = active ? 1 : 0;
      requestAnimation();
      startAudioFade();
    }

    gateHotspot.addEventListener("pointerenter", () => setGateActive(true));
    gateHotspot.addEventListener("pointerleave", () => setGateActive(false));

    soundHint.addEventListener("click", unlockAudio);
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    document.addEventListener("keydown", unlockAudio, { once: true });

    imageOne.addEventListener("load", resizeCanvases);
    window.addEventListener("resize", resizeCanvases);

    if (imageOne.complete) resizeCanvases();
  </script>
</body>
</html>
